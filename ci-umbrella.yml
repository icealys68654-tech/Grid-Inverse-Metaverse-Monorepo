name: Umbrella CMake & Monorepo CI Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  umbrella-build-and-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Configure & Build via Umbrella CMake
        run: |
          cmake -B build -S .
          cmake --build build
      - name: Boot Schema-Validated Grid Server & Run Smoke Probe
        run: |
          node apps/api-gateway/src/server.js &
          SERVER_PID=$!
          sleep 2
          node packages/smoke-probe/src/index.js --target http://localhost:4173
          kill $SERVER_PID
